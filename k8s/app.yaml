apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-app
  template:
    metadata:
      labels:
        app: quiz-app
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: quiz-app
          image: ${DOCKERHUB_USER}/online-quiz-python:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql://quizuser:quizpass_local@postgres:5432/quizdb"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-app
spec:
  type: NodePort
  selector:
    app: quiz-app
  ports:
    - port: 80
      targetPort: 8080
